name: Scrape tipster snapshot

# Runs the scrape off the request path and publishes the result JSON to the
# orphan `data-snapshot` branch. The Vercel app fetches
# raw.githubusercontent.com/<repo>/data-snapshot/snapshot.json and serves
# that, so live user requests never wait on (or time out on) the scrape.
on:
  schedule:
    - cron: '*/15 * * * *' # every 15 min (GitHub may delay under load)
  workflow_dispatch: {}

concurrency:
  group: tipster-snapshot
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      # Solves the Cloudflare challenges on Forebet / PredictZ / WinDrawWin /
      # WhoScored / Sports Mole article pages (see src/scrapers/tipsters/
      # fetchHtml.js). Reachable at http://localhost:8191 from the job.
      flaresolverr:
        image: ghcr.io/flaresolverr/flaresolverr:latest
        ports:
          - 8191:8191
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npx playwright install --with-deps chromium

      - name: Wait for FlareSolverr
        run: |
          for i in $(seq 1 45); do
            if curl -sf http://localhost:8191/ >/dev/null; then
              echo "FlareSolverr ready after ${i}x2s"; exit 0
            fi
            sleep 2
          done
          echo "FlareSolverr never became ready" >&2
          exit 1

      - name: Scrape
        env:
          TIPSTERS_DEBUG: 'true'
          SGPOOLS_DEBUG: 'true'
          FLARESOLVERR_URL: 'http://localhost:8191/v1'
          TIPSTERS_DEADLINE_MS: '480000'
          SPORTSMOLE_MAX_ARTICLES: '30'
        run: node scripts/scrape-snapshot.js snapshot.json

      - name: Upload scraper debug dumps
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scraper-debug
          path: |
            debug-tipsters/
            debug-sgpools-raw.html
          if-no-files-found: warn
          retention-days: 3

      - name: Publish snapshot.json to data-snapshot branch
        run: |
          set -euo pipefail
          test -s snapshot.json
          work="$(mktemp -d)"
          cp snapshot.json "$work/"
          # A vercel.json that disables deployments, so Vercel never builds a
          # preview off this branch when the workflow force-pushes it.
          printf '{ "git": { "deploymentEnabled": false } }\n' > "$work/vercel.json"
          cd "$work"
          git init -q
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -q -b data-snapshot
          git add snapshot.json vercel.json
          git commit -q -m "snapshot $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          # Force-push a single-commit orphan branch so history doesn't grow.
          git push -q --force \
            "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" \
            data-snapshot
